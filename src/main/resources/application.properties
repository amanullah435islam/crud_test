spring.application.name=${MYSQL_DATABASE}

# when Docker use korbo than ata use korbo:
spring.datasource.url=jdbc:mysql://mysql:3306/crud?createDatabaseIfNotExist=true

#when Direct IDEA(IntelliJ / Eclipse (Local PC)) te use korbo than ata use korbo:
#spring.datasource.url=jdbc:mysql://localhost:3307/${MYSQL_DATABASE}?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
server.port=8080


jwt.secret=${JWT_SECRET}
jwt.expiration=86400000


jwt.verification-expiration=3600000
jwt.reset-expiration=900000

#1 day = 24 hours = 86,400,000 ms
#1 hour = 3,600,000 ms
#15 minutes = 900,000 ms


#Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.frontend-url=http://localhost:8080/api/auth